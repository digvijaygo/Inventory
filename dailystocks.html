<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Stocks</title>
    <script src="auth-guard.js"></script>
    <link rel="stylesheet" href="dailystocks.css">
</head>
<body>
    <div class="page">
        <h1>Daily Stocks</h1>

        <section class="filter-panel">
            <div class="field-group">
                <label for="locationSelect">Location/Plant</label>
                <select id="locationSelect" required></select>
            </div>

            <div class="field-group">
                <label for="categorySelect">Category</label>
                <select id="categorySelect">
                    <option value="MS PIPE and MS ANGLE">MS PIPE and MS ANGLE</option>
                    <option value="PAINT (INNER)">PAINT (INNER)</option>
                    <option value="PAINT (OUTER)">PAINT (OUTER)</option>
                    <option value="ELECTRICAL MATERIAL">ELECTRICAL MATERIAL</option>
                    <option value="PLUMBING MATERIAL">PLUMBING MATERIAL</option>
                    <option value="__add_new_category__">+ Add New Category...</option>
                </select>
            </div>

            <div class="field-group">
                <label for="stockDate">Date</label>
                <input type="date" id="stockDate" required>
            </div>

            <div class="field-group">
                <label for="cabinCountInput">Cabin Count</label>
                <input type="number" id="cabinCountInput" min="1" step="1" value="20" required>
            </div>

            <button id="loadBtn" type="button">Load Details</button>
            <button id="exportExcelBtn" type="button" class="export-btn">Export to Excel</button>
        </section>

        <p id="readOnlyBadge" class="badge" style="display: none;">Read-only mode: past date data cannot be edited.</p>

        <section id="addSection" class="add-panel">
            <h2>Add Row</h2>
            <form id="addRowForm" class="add-form">
                <input type="text" id="sizeInput" placeholder="SIZE" required>
                <input type="number" id="qtyOneInput" placeholder="QTY FOR 1 CABIN" min="0" step="0.01" required>
                <input type="number" id="stockInput" placeholder="STOCK AT KPR" step="0.01" required>
                <button type="submit">Add Record</button>
            </form>
        </section>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>SR NO</th>
                        <th id="descriptionHeader">SIZE</th>
                        <th>QTY FOR 1 CABIN (20 FT) in NOS</th>
                        <th id="qtyForCountHeader">QTY FOR 20 CABIN (20 FT) in NOS</th>
                        <th>STOCK Available</th>
                        <th>REQUIRED</th>
                        <th>Cabin Wise Stock</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="stocksTableBody"></tbody>
            </table>
        </div>

        <section class="chart-panel" aria-label="Stock distribution chart">
            <h2>Daily Stock Summary</h2>
            <div class="chart-content">
                <div class="donut-wrap">
                    <div id="dailyStockDonut" class="donut-chart" role="img" aria-label="Donut chart for stock totals"></div>
                </div>
                <div class="donut-legend" id="donutLegend">
                    <div class="legend-item">
                        <span class="legend-dot stock-dot"></span>
                        <span class="legend-label">STOCK Available</span>
                        <strong id="totalStockAtKpr">0</strong>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot required-dot"></span>
                        <span class="legend-label">REQUIRED</span>
                        <strong id="totalRequired">0</strong>
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot cabin-dot"></span>
                        <span class="legend-label">Cabin Wise Stock</span>
                        <strong id="totalCabinWiseStock">0</strong>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const API_URL = './api/daily-stocks';
        const CATEGORY_API_URL = './api/daily-stock-categories';
        const ADD_CATEGORY_OPTION_VALUE = '__add_new_category__';
        const LOCATION_STORAGE_KEY = 'inventory_selected_location';
        const LOCATIONS = [
            'Arneel Industries Karodi',
            'Anil Industries Karodi',
            'Anil Industries Ghanegoan',
            'Anil Industries Yavatmal',
            'Kpr Projections'
        ];

        const stockDateInput = document.getElementById('stockDate');
        const locationSelect = document.getElementById('locationSelect');
        const categorySelect = document.getElementById('categorySelect');
        const cabinCountInput = document.getElementById('cabinCountInput');
        const loadBtn = document.getElementById('loadBtn');
        const exportExcelBtn = document.getElementById('exportExcelBtn');
        const addRowForm = document.getElementById('addRowForm');
        const stocksTableBody = document.getElementById('stocksTableBody');
        const addSection = document.getElementById('addSection');
        const readOnlyBadge = document.getElementById('readOnlyBadge');
        const descriptionHeader = document.getElementById('descriptionHeader');
        const qtyForCountHeader = document.getElementById('qtyForCountHeader');
        const dailyStockDonut = document.getElementById('dailyStockDonut');
        const totalStockAtKpr = document.getElementById('totalStockAtKpr');
        const totalRequired = document.getElementById('totalRequired');
        const totalCabinWiseStock = document.getElementById('totalCabinWiseStock');

        let currentRows = [];
        let editingRowId = null;
        let lastSelectedCategory = '';

        function normalizeCategoryName(value) {
            return String(value || '').trim().replace(/\s+/g, ' ');
        }

        function normalizeLocationName(value) {
            return String(value || '').trim().replace(/\s+/g, ' ');
        }

        function isValidLocation(value) {
            return LOCATIONS.includes(normalizeLocationName(value));
        }

        function initializeLocationOptions() {
            locationSelect.innerHTML = '';

            LOCATIONS.forEach((locationName) => {
                const option = document.createElement('option');
                option.value = locationName;
                option.textContent = locationName;
                locationSelect.appendChild(option);
            });

            const savedLocation = normalizeLocationName(localStorage.getItem(LOCATION_STORAGE_KEY) || '');
            locationSelect.value = isValidLocation(savedLocation) ? savedLocation : LOCATIONS[0];
        }

        function renderCategoryOptions(categories, selectedCategory) {
            categorySelect.innerHTML = '';

            categories.forEach((categoryName) => {
                const option = document.createElement('option');
                option.value = categoryName;
                option.textContent = categoryName;
                categorySelect.appendChild(option);
            });

            const addOption = document.createElement('option');
            addOption.value = ADD_CATEGORY_OPTION_VALUE;
            addOption.textContent = '+ Add New Category...';
            categorySelect.appendChild(addOption);

            const normalizedSelected = normalizeCategoryName(selectedCategory);
            if (normalizedSelected && categories.includes(normalizedSelected)) {
                categorySelect.value = normalizedSelected;
            } else if (categories.length > 0) {
                categorySelect.value = categories[0];
            }

            lastSelectedCategory = categorySelect.value || '';
        }

        async function loadCategories(selectedCategory) {
            try {
                const response = await fetch(CATEGORY_API_URL);
                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to load categories.');
                }

                const rows = await response.json();
                const categories = rows
                    .map((row) => normalizeCategoryName(row.name))
                    .filter((name) => name);

                renderCategoryOptions(categories, selectedCategory);
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to load categories.');
            }
        }

        async function addNewCategory() {
            const inputValue = window.prompt('Enter new category name:');
            if (inputValue === null) {
                categorySelect.value = lastSelectedCategory;
                return;
            }

            const newCategory = normalizeCategoryName(inputValue);
            if (!newCategory) {
                alert('Please enter a category name.');
                categorySelect.value = lastSelectedCategory;
                return;
            }

            try {
                const response = await fetch(CATEGORY_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newCategory })
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to add category.');
                }

                await loadCategories(newCategory);
                lastSelectedCategory = categorySelect.value;
                await loadStocks();
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to add category.');
                categorySelect.value = lastSelectedCategory;
            }
        }

        function getTodayLocalISO() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function toNumber(value) {
            const num = Number(value);
            return Number.isFinite(num) ? num : 0;
        }

        function formatValue(value) {
            if (!Number.isFinite(value)) return '0';
            if (Number.isInteger(value)) return String(value);
            return value.toFixed(2);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function isTodaySelected() {
            return stockDateInput.value === getTodayLocalISO();
        }

        function getCabinCount() {
            const count = Number(cabinCountInput.value || 20);
            if (!Number.isFinite(count) || count <= 0) {
                return 20;
            }

            return Math.floor(count);
        }

        function updateDynamicLabels() {
            const isMsCategory = categorySelect.value === 'MS PIPE and MS ANGLE';
            const cabinCount = getCabinCount();

            descriptionHeader.textContent = isMsCategory ? 'SIZE' : 'MATERIAL DESCRIPTION';
            document.getElementById('sizeInput').placeholder = isMsCategory ? 'SIZE' : 'MATERIAL DESCRIPTION';
            qtyForCountHeader.textContent = `QTY FOR ${cabinCount} CABIN (20 FT) in NOS`;
        }

        function refreshModeUI() {
            const isToday = isTodaySelected();

            addSection.style.display = isToday ? 'block' : 'none';
            readOnlyBadge.style.display = !isToday ? 'block' : 'none';
            updateDynamicLabels();
        }

        function updateDonutChart(rows) {
            const cabinCount = getCabinCount();
            let stockTotal = 0;
            let requiredTotal = 0;
            let cabinWiseTotal = 0;

            rows.forEach((row) => {
                const qtyOne = toNumber(row.qty_for_1_cabin);
                const qtyForCount = qtyOne * cabinCount;
                const stockAtKpr = toNumber(row.stock_at_kpr);
                const required = stockAtKpr - qtyForCount;
                const cabinWiseStock = qtyOne === 0 ? 0 : stockAtKpr / qtyOne;

                stockTotal += stockAtKpr;
                requiredTotal += required;
                cabinWiseTotal += cabinWiseStock;
            });

            totalStockAtKpr.textContent = formatValue(stockTotal);
            totalRequired.textContent = formatValue(requiredTotal);
            totalCabinWiseStock.textContent = formatValue(cabinWiseTotal);

            const stockSegment = Math.max(stockTotal, 0);
            const requiredSegment = Math.max(requiredTotal, 0);
            const cabinSegment = Math.max(cabinWiseTotal, 0);
            const total = stockSegment + requiredSegment + cabinSegment;

            if (total <= 0) {
                dailyStockDonut.style.background = 'conic-gradient(#e5e7eb 0deg 360deg)';
                dailyStockDonut.setAttribute('aria-label', 'No positive values available for donut chart');
                return;
            }

            const stockDeg = (stockSegment / total) * 360;
            const requiredDeg = (requiredSegment / total) * 360;
            const cabinDeg = (cabinSegment / total) * 360;

            dailyStockDonut.style.background = `conic-gradient(
                #16a34a 0deg ${stockDeg}deg,
                #ea580c ${stockDeg}deg ${stockDeg + requiredDeg}deg,
                #2563eb ${stockDeg + requiredDeg}deg ${stockDeg + requiredDeg + cabinDeg}deg
            )`;
            dailyStockDonut.setAttribute(
                'aria-label',
                `Donut chart totals - Stock at KPR: ${formatValue(stockTotal)}, Required: ${formatValue(requiredTotal)}, Cabin Wise Stock: ${formatValue(cabinWiseTotal)}`
            );
        }

        function renderGrid(rows) {
            stocksTableBody.innerHTML = '';
            currentRows = rows;
            updateDonutChart(rows);
            const cabinCount = getCabinCount();
            const canEditRows = isTodaySelected();

            rows.forEach((row, index) => {
                const qtyOne = toNumber(row.qty_for_1_cabin);
                const qtyForCount = qtyOne * cabinCount;
                const stockAtKpr = toNumber(row.stock_at_kpr);
                const required = stockAtKpr - qtyForCount;
                const cabinWiseStock = qtyOne === 0 ? 0 : stockAtKpr / qtyOne;
                const isEditing = canEditRows && editingRowId === row.id;

                const descriptionCell = isEditing
                    ? `<input class="table-input" type="text" id="edit-size-${row.id}" value="${escapeHtml(row.size)}">`
                    : escapeHtml(row.size);

                const qtyOneCell = isEditing
                    ? `<input class="table-input" type="number" id="edit-qty-one-${row.id}" min="0" step="0.01" value="${qtyOne}">`
                    : formatValue(qtyOne);

                const stockCell = isEditing
                    ? `<input class="table-input" type="number" id="edit-stock-${row.id}" step="0.01" value="${stockAtKpr}">`
                    : formatValue(stockAtKpr);

                const actionsCell = canEditRows
                    ? (isEditing
                        ? `<button class="save-btn" onclick="saveRowEdit(${row.id})">Save</button>
                           <button class="cancel-btn" onclick="cancelRowEdit()">Cancel</button>`
                        : `<button class="edit-btn" onclick="startRowEdit(${row.id})">Edit</button>
                           <button class="delete-btn" onclick="deleteRow(${row.id})">Delete</button>`)
                    : '<span class="readonly-text">Read-only</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${descriptionCell}</td>
                    <td>${qtyOneCell}</td>
                    <td>${formatValue(qtyForCount)}</td>
                    <td>${stockCell}</td>
                    <td>${formatValue(required)}</td>
                    <td>${formatValue(cabinWiseStock)}</td>
                    <td class="actions-cell">${actionsCell}</td>
                `;
                stocksTableBody.appendChild(tr);
            });

            if (!rows.length) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td colspan="8" class="empty-row">No records found for selected date and category.</td>';
                stocksTableBody.appendChild(tr);
            }
        }

        function startRowEdit(id) {
            if (!isTodaySelected()) {
                alert('Past date is read-only.');
                return;
            }

            editingRowId = id;
            renderGrid(currentRows);
        }

        function cancelRowEdit() {
            editingRowId = null;
            renderGrid(currentRows);
        }

        async function saveRowEdit(id) {
            if (!isTodaySelected()) {
                alert('Past date is read-only.');
                return;
            }

            const sizeInput = document.getElementById(`edit-size-${id}`);
            const qtyInput = document.getElementById(`edit-qty-one-${id}`);
            const stockInput = document.getElementById(`edit-stock-${id}`);

            if (!sizeInput || !qtyInput || !stockInput) {
                return;
            }

            const size = sizeInput.value.trim();
            const qtyFor1Cabin = Number(qtyInput.value || 0);
            const stockAtKpr = Number(stockInput.value || 0);
            const cabinCount = getCabinCount();

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        size,
                        qty_for_1_cabin: qtyFor1Cabin,
                        stock_at_kpr: stockAtKpr,
                        cabin_count: cabinCount
                    })
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to update stock row.');
                }

                editingRowId = null;
                await loadStocks();
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to update stock row.');
            }
        }

        async function deleteRow(id) {
            if (!isTodaySelected()) {
                alert('Past date is read-only.');
                return;
            }

            if (!confirm('Are you sure you want to delete this row?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to delete stock row.');
                }

                if (editingRowId === id) {
                    editingRowId = null;
                }

                await loadStocks();
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to delete stock row.');
            }
        }

        async function loadStocks() {
            if (!stockDateInput.value) {
                alert('Please select a date.');
                return;
            }

            const selectedLocation = normalizeLocationName(locationSelect.value);
            if (!isValidLocation(selectedLocation)) {
                alert('Please select a valid Location/Plant.');
                return;
            }

            if (stockDateInput.value > getTodayLocalISO()) {
                alert('Future date is not allowed.');
                stockDateInput.value = getTodayLocalISO();
            }

            refreshModeUI();

            try {
                const params = new URLSearchParams({
                    date: stockDateInput.value,
                    location: selectedLocation,
                    category: categorySelect.value
                });
                const response = await fetch(`${API_URL}?${params.toString()}`);

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to load daily stocks.');
                }

                const rows = await response.json();
                renderGrid(rows);
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to load daily stocks.');
            }
        }

        addRowForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!isTodaySelected()) {
                alert('Past date is read-only. You can add records only for today.');
                return;
            }

            const size = document.getElementById('sizeInput').value.trim();
            const qtyFor1Cabin = Number(document.getElementById('qtyOneInput').value || 0);
            const stockAtKpr = Number(document.getElementById('stockInput').value || 0);
            const cabinCount = getCabinCount();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        stock_date: stockDateInput.value,
                        location: normalizeLocationName(locationSelect.value),
                        category: categorySelect.value,
                        size,
                        qty_for_1_cabin: qtyFor1Cabin,
                        cabin_count: cabinCount,
                        stock_at_kpr: stockAtKpr
                    })
                });

                if (!response.ok) {
                    const errorPayload = await response.json().catch(() => ({}));
                    throw new Error(errorPayload.error || 'Unable to add stock row.');
                }

                addRowForm.reset();
                updateDynamicLabels();
                await loadStocks();
            } catch (error) {
                console.error(error);
                alert(error.message || 'Unable to add stock row.');
            }
        });

        loadBtn.addEventListener('click', loadStocks);

        exportExcelBtn.addEventListener('click', () => {
            if (!stockDateInput.value) {
                alert('Please select a date first.');
                return;
            }

            if (!currentRows.length) {
                alert('No records available to export for selected filters.');
                return;
            }

            if (typeof XLSX === 'undefined') {
                alert('Excel export library failed to load. Please refresh and try again.');
                return;
            }

            const cabinCount = getCabinCount();
            const isMsCategory = categorySelect.value === 'MS PIPE and MS ANGLE';
            const descriptionColumn = isMsCategory ? 'SIZE' : 'MATERIAL DESCRIPTION';
            const qtyForCountColumn = `QTY FOR ${cabinCount} CABIN (20 FT) in NOS`;

            const exportRows = currentRows.map((row, index) => {
                const qtyOne = toNumber(row.qty_for_1_cabin);
                const qtyForCount = qtyOne * cabinCount;
                const stockAtKpr = toNumber(row.stock_at_kpr);
                const required = stockAtKpr - qtyForCount;
                const cabinWiseStock = qtyOne === 0 ? 0 : stockAtKpr / qtyOne;

                return {
                    'SR NO': index + 1,
                    'LOCATION/PLANT': normalizeLocationName(locationSelect.value),
                    [descriptionColumn]: row.size || '',
                    'QTY FOR 1 CABIN (20 FT) in NOS': qtyOne,
                    [qtyForCountColumn]: qtyForCount,
                    'STOCK AT KPR': stockAtKpr,
                    'REQUIRED': required,
                    'Cabin Wise Stock': cabinWiseStock
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(exportRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'Daily Stocks');

            const safeCategory = categorySelect.value.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const filename = `daily-stocks-${safeCategory || 'category'}-${stockDateInput.value}.xlsx`;
            XLSX.writeFile(workbook, filename);
        });

        categorySelect.addEventListener('change', async () => {
            if (categorySelect.value === ADD_CATEGORY_OPTION_VALUE) {
                await addNewCategory();
                updateDynamicLabels();
                return;
            }

            lastSelectedCategory = categorySelect.value;
            await loadStocks();
        });
        locationSelect.addEventListener('change', async () => {
            localStorage.setItem(LOCATION_STORAGE_KEY, locationSelect.value);
            editingRowId = null;
            await loadStocks();
        });
        stockDateInput.addEventListener('change', loadStocks);
        cabinCountInput.addEventListener('change', () => {
            cabinCountInput.value = String(getCabinCount());
            updateDynamicLabels();
            renderGrid(currentRows);
        });

        window.startRowEdit = startRowEdit;
        window.cancelRowEdit = cancelRowEdit;
        window.saveRowEdit = saveRowEdit;
        window.deleteRow = deleteRow;

        async function initializePage() {
            const today = getTodayLocalISO();
            initializeLocationOptions();
            await loadCategories('MS PIPE and MS ANGLE');
            stockDateInput.max = today;
            stockDateInput.value = today;
            await loadStocks();
        }

        initializePage();
    </script>
</body>
</html>
